name: python-publish

# Triggered by the tag push itself, not by the GitHub Release.
# python-packages.yml creates that Release using GITHUB_TOKEN, and GitHub's
# anti-recursion rule means events produced by GITHUB_TOKEN never start another
# workflow — so `release: published` silently never fired here and the package
# was never uploaded, while every other check went green.
on:
  push:
    tags:
      - "v[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.repository == 'WaveSpeedAI/llama-index-tools-wavespeed' &&
      ((github.event_name == 'push' && github.ref_type == 'tag' &&
        startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel

    - name: Build package
      run: python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
